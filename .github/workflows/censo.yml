name: Censo 2022 por setor

on:
  workflow_dispatch:
    inputs:
      cidades:
        description: "Cidades (vazio = todas)"
        required: false
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  group: censo
  cancel-in-progress: false

jobs:
  censo:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: pip install requests==2.32.3 pyogrio==0.10.0 geopandas==1.0.1 shapely==2.0.6
      - name: Baixar o Censo
        run: python scripts/atualizar_censo.py ${{ inputs.cidades }}
      - name: Salvar no repositório
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "Imóveis em Números (robô)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/censo
          git diff --cached --quiet || (git commit -m "Censo 2022 por setor: $(date -u +%Y-%m-%d)" && git pull --rebase && git push)
