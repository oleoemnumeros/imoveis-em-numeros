name: Atualizar dados do ITBI e publicar o site

on:
  # as prefeituras publicam uma vez por mês, em datas diferentes; o robô confere toda segunda
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:
    inputs:
      cidades:
        description: "Só estas cidades (slugs separados por espaço; vazio = todas)"
        type: string
        default: ""
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "site/**"
      - ".github/workflows/atualizar.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: atualizar
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install requests==2.32.3 openpyxl==3.1.5

      - name: Baixar e agregar o ITBI das prefeituras
        id: robo
        continue-on-error: true
        # no push, só regenera o site com os dados já salvos (o robô roda na segunda e no botão)
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[robo]')
        run: python scripts/atualizar.py ${{ inputs.cidades }}

      - name: Salvar no repositório
        if: always()
        run: |
          git config user.name "Imóveis em Números (robô)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Sem mudanças."
          else
            git commit -m "Dados atualizados: $(date -u +%Y-%m-%d)"
            git pull --rebase -q || true
            git push
          fi

      - name: Gerar site
        if: always() && hashFiles('scripts/gerar_site.py') != ''
        env:
          BASE: ${{ vars.SITE_BASE }}
          PREVIA: ${{ vars.PREVIA }}
        run: python scripts/gerar_site.py

      - name: Empacotar site
        if: always() && hashFiles('docs/index.html') != ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Publicar no GitHub Pages
        id: publicar
        if: always() && hashFiles('docs/index.html') != ''
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Esperar antes de tentar publicar de novo
        if: always() && steps.publicar.outcome == 'failure'
        run: sleep 45

      - name: Publicar no GitHub Pages (segunda tentativa)
        if: always() && steps.publicar.outcome == 'failure'
        uses: actions/deploy-pages@v4
