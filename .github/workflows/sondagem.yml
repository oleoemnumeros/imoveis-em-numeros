name: Sondagem das bases de ITBI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/sondagem*.py"
      - ".github/workflows/sondagem.yml"

permissions:
  contents: write

concurrency:
  group: sondagem
  cancel-in-progress: false

jobs:
  sondar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: pip install requests==2.32.3 openpyxl==3.1.5
      - name: Sondar as prefeituras
        run: python scripts/sondagem_dns.py
      - name: Salvar no repositório
        run: |
          git config user.name "Imóveis em Números (robô)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sondagem*.json
          git diff --cached --quiet || (git commit -m "Sondagem das bases de ITBI: $(date -u +%Y-%m-%d)" && git push)
